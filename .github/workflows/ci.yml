name: eidos-ds CI

# Eidos DS monorepo — continuous integration. Keeps the design system honest on
# every push: the @eidos/ui library typechecks + builds, the registry builds and
# validates, the eidos CLI E2E passes, Storybook builds, and the docs app builds
# + renders headless.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ui:
    name: "@eidos/ui (typecheck + build)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run ui:typecheck
      - run: npm run ui:build

  registry-cli:
    name: "registry build + eidos CLI E2E"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run registry:build
      - run: npm run cli:test
      - run: npm run cli:test:full

  storybook:
    name: "Storybook build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run sb:build

  docs:
    name: "docs app (build + headless render)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run verify || true
      - name: build plugin
        run: npm run build:plugin

  contract:
    name: "contract gate (eidos:verify)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # surfaces the contract reads: registry build (public/r/*) + the generated nav/props
      - run: npm run registry:build
      - run: node scripts/gen-nav.mjs && node scripts/gen-migrated.mjs && node scripts/gen-examples.mjs && node scripts/gen-props.mjs
      # the committed contract.components[] must match disk
      - run: node scripts/eidos-gen.mjs contract --check
      # DTCG export must track the canonical token source
      - run: npm run gen:tokens -- --check
      # full clause sweep — ADVISORY until the parity/story/docs backlog is burned down
      # (Phases 4–5); flip to `--all --strict --heavy` to make it blocking.
      - run: npm run eidos:verify -- --all --static || true
      - run: npm run eidos:health || true
      - name: upload health wall
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eidos-health
          path: |
            reports/state.json
            EIDOS-HEALTH.md
